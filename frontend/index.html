<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApiBase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button onclick="testar()">Chamar API</button>
    <div id="dados"></div>

    <hr>

    <h2>Cadastro</h2>
    <input type="text"     id="cad-nome"  placeholder="Nome" /><br>
    <input type="email"    id="cad-email" placeholder="Email" /><br>
    <input type="password" id="cad-senha" placeholder="Senha" /><br>
    <button onclick="cadastrar()">Cadastrar</button>

    <hr>

    <h2>Login</h2>
    <input type="email"    id="log-email" placeholder="Email" /><br>
    <input type="password" id="log-senha" placeholder="Senha" /><br>
    <button onclick="login()">Entrar</button>

    <hr>

    <h2>Usuários Cadastrados</h2>
    <ul id="lista-usuarios"></ul>

    <p id="mensagem"></p>

    <script src="script.js"></script>
</body>
</html>
